<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Киоск оплаты</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Левая часть с полем ввода и выпадающим списком -->
        <div class="input-section">
            <input id="phone-input" type="text" placeholder="Введите номер телефона" readonly>
            <ul id="client-dropdown"></ul>
        </div>

        <!-- Правая часть с виртуальной клавиатурой -->
        <div class="keyboard-section">
            <button class="key">1</button>
            <button class="key">2</button>
            <button class="key">3</button>
            <button class="key">4</button>
            <button class="key">5</button>
            <button class="key">6</button>
            <button class="key">7</button>
            <button class="key">8</button>
            <button class="key">9</button>
            <button class="key action" id="clear">C</button>
            <button class="key">0</button>
            <button class="key action" id="backspace">←</button>
        </div>
    </div>

    <!-- Кнопка оплаты внизу -->
    <div class="pay-container">
        <button id="pay-button">Оплатить</button>
    </div>

    <script src="main.js"></script>
</body>
</html>
